[package]
name = "u-api-studio"
version = "0.1.2"
description = "A local API workbench and workflow studio"
license = "MIT"
repository = "https://github.com/duckfollow/u"
edition = "2021"
[lib]
name = "u_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "u"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
